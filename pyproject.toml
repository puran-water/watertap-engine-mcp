[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "watertap-engine-mcp"
version = "0.1.0"
description = "Build and solve steady-state process flowsheets using WaterTAP, IDAES and Pyomo, with structured solver diagnostics."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*", "NOTICE", "THIRD-PARTY-NOTICES/**/*"]
authors = [{name = "Puran Water"}]
dependencies = [
  "fastmcp>=3.0",
  "typer==0.21.1",
  "rich==14.3.2",
  "pydantic==2.12.5",
  "watertap>=1.8.0,<1.9",
  "idaes-pse>=2.13.0,<2.14",
  "pyomo>=6.9.5,<7",
  "reaktoro-pse==0.3.0",
  "puran-mcp-support[simulation]==0.1.0"
]

[project.scripts]
watertap-engine-mcp = "watertap_engine_mcp.__main__:main"

[project.urls]
Homepage = "https://puranwater.com"
Repository = "https://github.com/puran-water/watertap-engine-mcp"
Issues = "https://github.com/puran-water/watertap-engine-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/watertap_engine_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE*", "NOTICE", "THIRD-PARTY-NOTICES", "LICENSE-TABLE.md", "SCAN-REPORT.md", "TEST-RESULTS.md", "HISTORICAL-QUALITY.md", "RESOURCE-LICENSES.csv", "KNOWN-ISSUES.md", "pyproject.toml"]
